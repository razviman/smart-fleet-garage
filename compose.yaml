services:
  mysql:
    image: 'mysql:8.0'
    container_name: 'spring_mysql_db'
    environment:
      - 'MYSQL_DATABASE=proiect_db'
      - 'MYSQL_USER=razvan'
      - 'MYSQL_PASSWORD=parola123'
      - 'MYSQL_ROOT_PASSWORD=rootparola123'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  ollama:
    image: 'ollama/ollama:latest'
    container_name: 'ollama'
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    # Această secțiune obligă Docker să folosească placa video GTX 1650
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  mysql_data:
  ollama_data: