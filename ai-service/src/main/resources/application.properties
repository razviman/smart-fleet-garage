spring.application.name=ai_service
server.port=8080


# http://localhost:8080/swagger-ui/index.html for swagger ui


#docker settings
spring.docker.compose.enabled=true
spring.docker.compose.lifecycle-management=start_only
spring.docker.compose.file=../compose.yaml

spring.datasource.url=jdbc:mysql://localhost:3306/proiect_db?serverTimezone=UTC
spring.datasource.username=razvan
spring.datasource.password=parola123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# hibernate / jpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false


spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2

logging.level.org.springframework.ai.chat.client.advisor=DEBUG

# Modelul dedicat din Ollama pentru transformarea textului in vectori
spring.ai.ollama.embedding.model=mxbai-embed-large

# Configurare Qdrant Vector Store
# http://localhost:6333/dashboard 
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=auto_manuals
spring.ai.vectorstore.qdrant.initialize-schema=true